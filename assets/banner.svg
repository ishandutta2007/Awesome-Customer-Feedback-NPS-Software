<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filter for soft blur on glow orbs -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.18; stroke-width: 1; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 46px; font-weight: 800; fill: #ffffff; letter-spacing: -1px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 400; fill: #94a3b8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .score-badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
    
    /* Dynamic animated aspects */
    @keyframes pulseScale {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }

    .animated-orb1 { animation: floatSlow 7s ease-in-out infinite; }
    .animated-orb2 { animation: floatReverse 8s ease-in-out infinite; }
    .animated-card1 { animation: floatSlow 6s ease-in-out infinite; transform-origin: center; }
    .animated-card2 { animation: floatReverse 6.5s ease-in-out infinite; transform-origin: center; }
    .animated-wave { animation: waveMove 10s ease-in-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Subtle Matrix Grid -->
  <g class="grid-line">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Glowing Orbs in Background (Non-intrusive) -->
  <circle cx="160" cy="110" r="140" fill="url(#glowGrad1)" filter="url(#blurFilter)" class="animated-orb1"/>
  <circle cx="1060" cy="300" r="160" fill="url(#glowGrad2)" filter="url(#blurFilter)" class="animated-orb2"/>

  <!-- Dynamic Animated Chart Waves in Background -->
  <g class="animated-wave" opacity="0.25">
    <path d="M-50,330 Q150,260 350,310 T750,270 T1150,320 T1350,280" fill="none" stroke="#6366f1" stroke-width="2"/>
    <path d="M-50,345 Q200,370 450,330 T850,350 T1250,320 T1450,340" fill="none" stroke="#ec4899" stroke-width="2"/>
  </g>

  <!-- Animated Decorative Background Card 1: NPS Rating Bar (Right Side) -->
  <g class="animated-card1" opacity="0.9">
    <rect x="850" y="55" width="290" height="135" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="872" y="88" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Net Promoter Score (NPS)</text>
    <rect x="872" y="102" width="70" height="24" rx="6" fill="#10b981"/>
    <text x="888" y="118" class="score-badge-text">+68 Excellent</text>
    <text x="872" y="152" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">● 74% Promoters  ● 20% Passives  ● 6% Detractors</text>
    <!-- Micro NPS scale dots -->
    <circle cx="878" cy="168" r="4" fill="#ef4444"/>
    <circle cx="894" cy="168" r="4" fill="#ef4444"/>
    <circle cx="910" cy="168" r="4" fill="#f59e0b"/>
    <circle cx="926" cy="168" r="4" fill="#f59e0b"/>
    <circle cx="942" cy="168" r="4" fill="#10b981"/>
    <circle cx="958" cy="168" r="4" fill="#10b981"/>
    <circle cx="974" cy="168" r="4" fill="#10b981"/>
  </g>

  <!-- Animated Decorative Background Card 2: Micro-Survey Prompt (Bottom Right) -->
  <g class="animated-card2" opacity="0.9">
    <rect x="870" y="215" width="270" height="145" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2"/>
    <circle cx="895" cy="242" r="6" fill="#6366f1"/>
    <text x="912" y="246" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">In-App Micro-Survey</text>
    <text x="895" y="272" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">"How easy was setting up your project?"</text>
    <rect x="895" y="290" width="48" height="26" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="906" y="307" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">😍 Great</text>
    <rect x="951" y="290" width="48" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="965" y="307" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">😐 Okay</text>
    <rect x="1007" y="290" width="48" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="1021" y="307" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">🙁 Poor</text>
    <text x="895" y="342" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">⚡ Triggered by event: user.onboarded</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badges, Tagline (Always Clear & Centered Left) -->
  <g transform="translate(70, 75)">
    <!-- Top Pill Category -->
    <rect x="0" y="0" width="290" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="5" fill="#22c55e"/>
    <text x="30" y="21" class="pill-text">CURATED REPO • NPS &amp; CX TOOLKIT</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text">Awesome Customer Feedback</text>
    <text x="0" y="130" class="title-text" fill="url(#primaryGrad)">&amp; NPS Software 🚀</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="172" class="sub-text">Top Open-Source Engines &amp; Enterprise SaaS Platforms</text>
    <text x="0" y="200" fill="#64748b" font-family="-apple-system, sans-serif" font-size="14">In-App Micro-Surveys • Voice of Customer • Public Roadmaps • Self-Hosted CX</text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="135" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" class="pill-text">🌟 Open Source</text>

      <rect x="145" y="0" width="125" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="157" y="20" class="pill-text">📊 Net Promoter</text>

      <rect x="280" y="0" width="125" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="292" y="20" class="pill-text">🔒 Self-Hosted</text>

      <rect x="415" y="0" width="135" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="427" y="20" class="pill-text">🤖 AI VoC Insights</text>
    </g>
  </g>
</svg>